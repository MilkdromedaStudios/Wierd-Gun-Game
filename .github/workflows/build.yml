name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # A real ref is needed to push the built jar back.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Identify the jar
        id: jar
        run: |
          # The sources jar lands here too and is not the mod, so it is excluded.
          path=$(find builds -maxdepth 1 -name 'ledger-*.jar' ! -name '*-sources.jar' | head -1)
          if [ -z "$path" ]; then
            echo "No mod jar was produced." >&2
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"
          ls -lh builds/

      - name: Upload jar as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ledger-jar
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

      # Keeps /builds holding the current jar so it is browsable in the repo.
      # This usually reports no change, because a code commit is normally made
      # with a locally built jar already in it; that is the step working, not
      # failing. It matters when someone pushes source without building.
      - name: Replace the jar in /builds
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --force overrides .gitignore, so the sources jar must be excluded by
          # path rather than relying on the ignore rule.
          git add --force "${{ steps.jar.outputs.path }}"
          if git diff --staged --quiet; then
            echo "The committed jar already matches this build."
          else
            echo "Updating the jar in /builds."
            git commit -m "Build ledger jar into /builds [skip ci]"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      # Every successful build on a branch is published as its own release, so
      # there is always a downloadable jar that is not buried in the git tree.
      - name: Publish a release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="build-${{ github.run_number }}"
          title="Ledger build ${{ github.run_number }}"
          notes=$(printf 'Automated build of `%s`.\n\nCommit: %s\nBranch: `%s`\n\nDrop the jar in your server or client `mods/` folder alongside Fabric API. Requires Minecraft 26.2 and Java 25.' \
            "${{ steps.jar.outputs.name }}" "${{ github.sha }}" "${{ github.ref_name }}")

          # A re-run of the same build number would collide, so replace rather
          # than fail on an existing tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.jar.outputs.path }}" --clobber
          else
            gh release create "$tag" "${{ steps.jar.outputs.path }}" \
              --title "$title" \
              --notes "$notes" \
              --target "${{ github.sha }}"
          fi
          echo "Released as $tag"
