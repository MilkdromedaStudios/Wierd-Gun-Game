name: WeirdGunGame
version: '${project.version}'
main: com.milkdromeda.wgg.WeirdGunGamePlugin
api-version: '26.2'
authors: [MilkdromedaStudios]
description: Roblox-style Weird Gun Game for Minecraft. Build a gun from 60 parts, then fight the Superbox.
website: https://github.com/MilkdromedaStudios/Wierd-Gun-Game
folia-supported: false

commands:
  wgg:
    description: Open the gun bench, grab guns and knives, and run Superbox tournaments.
    usage: /wgg <bench|gun|knife|random|parts|tournament|reload>
    aliases: [weirdgun, gungame]

permissions:
  wgg.use:
    description: Use the gun bench and take guns and knives.
    default: true
  wgg.tournament.start:
    description: Start and stop Superbox tournaments.
    default: op
  wgg.admin:
    description: Reload the plugin config.
    default: op
